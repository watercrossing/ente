name: "Publish GHCR (Server)"

# Upstream builds whatever commit api.ente.com reports as live and pushes it to
# ghcr.io/ente/server. In this fork we want our own code, and we can only write
# to our own package namespace, so both of those are changed below.

on:
    push:
        branches:
            - main
        paths:
            - "server/**"
            - ".github/workflows/server-publish-ghcr.yml"
    workflow_dispatch:

permissions:
    actions: read
    contents: read
    packages: write

concurrency:
    group: server-publish-ghcr
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Log in to GHCR
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

            - name: Build and push
              env:
                  # GHCR paths must be lowercase; GitHub owner names are
                  # case-insensitive, so fold it rather than trusting the casing.
                  IMAGE_OWNER: ${{ github.repository_owner }}
              run: |
                  image="ghcr.io/$(printf '%s' "${IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')/ente-server"
                  docker buildx create --use
                  docker buildx build --push \
                      --file server/Dockerfile \
                      --platform linux/amd64,linux/arm64 \
                      --build-arg GIT_COMMIT="${GITHUB_SHA}" \
                      --tag "${image}:${GITHUB_SHA}" \
                      --tag "${image}:latest" \
                      server
