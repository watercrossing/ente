name: "Build (Photos desktop)"

# Builds this fork's Photos desktop installers and publishes them as a release
# here. Upstream's release process in .github/docs/app-release.md does not apply:
# it publishes to ente/nightly and ente/photos-desktop, and it versions from
# desktop/package.json. See the "Prepare release" step for what we do instead.

on:
    push:
        branches:
            - main
        paths:
            - "desktop/**"
            # The renderer is web/apps/photos, exported from the whole web
            # workspace, and rust/ supplies both the napi codegen and the
            # native modules the app loads — a change to either ships in the
            # installer, so both belong here.
            - "web/**"
            - "rust/**"
            - ".github/workflows/photos-desktop-build.yml"
            - ".github/scripts/photos-desktop-*.mjs"
            - ".github/scripts/release-notes.mjs"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: photos-desktop-build
    # A build takes ~40 minutes, and only the tip of main is worth an
    # installer: a push that lands while one is running supersedes it rather
    # than queueing a second release behind it. Serializing instead would be
    # correct too — build-metadata numbers the release from the tags already
    # published, so a queued run picks up the next build number — but it spends
    # a runner-hour on a commit nobody will install.
    cancel-in-progress: true

jobs:
    build-metadata:
        runs-on: ubuntu-latest

        outputs:
            commit_sha: ${{ steps.prepare.outputs.commit_sha }}
            release_version: ${{ steps.prepare.outputs.release_version }}
            release_tag: ${{ steps.prepare.outputs.release_tag }}
            release_title: ${{ steps.prepare.outputs.release_title }}
            release_body: ${{ steps.prepare.outputs.release_body }}
            release_body_grouped: ${{ steps.prepare.outputs.release_body_grouped }}
            has_new_changes: ${{ steps.prepare.outputs.has_new_changes }}

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  # The pushed commit, not the branch tip: builds start on every
                  # push now, so main can move on between the push and the
                  # runner picking the job up, and the release title and tag
                  # would then name a commit this run did not build.
                  ref: ${{ github.sha }}

            - name: Prepare release
              id: prepare
              shell: bash
              run: |
                  set -euo pipefail

                  # This fork's builds get their own CalVer line, YYYY.MMDD.N,
                  # instead of upstream's version. Upstream's number sits in
                  # desktop/package.json as "<next>-beta" for weeks at a time, so
                  # it cannot identify a build; and since desktop/electron-builder.yml
                  # points the update feed at this repo, the version string is what
                  # electron-updater compares. A prerelease suffix would also flip
                  # it into its allowPrerelease path, which walks the releases feed
                  # and skips any release whose tag is not valid semver. A plain
                  # stable version keeps it on GitHub's "latest release" pointer,
                  # where only the version inside latest.yml matters.
                  #
                  # The month is unpadded (2026.816.1, not 2026.0816.1) because
                  # semver rejects leading zeros in a numeric component. Ordering
                  # still holds: 2026.101.1 < 2026.816.1 < 2026.1231.1 < 2027.101.1.
                  base="$(date -u +%Y.%-m%d)"

                  # Tags are prefixed with wc- so that fetching upstream's tags
                  # never collides with ours.
                  tags="$(git ls-remote --tags --refs origin 'wc-photos-desktop-v*' | sed 's#.*refs/tags/##' | sort -V)"
                  previous_tag="$(printf '%s\n' "${tags}" | tail -n 1)"
                  built_today="$(printf '%s\n' "${tags}" | sed -n "s/^wc-photos-desktop-v${base}\.\([0-9]\{1,\}\)$/\1/p" | sort -n | tail -n 1)"

                  release_version="${base}.$(( ${built_today:-0} + 1 ))"
                  release_tag="wc-photos-desktop-v${release_version}"

                  upstream_version="$(node .github/scripts/photos-desktop-version.mjs get)"
                  release_title="🖥️ Photos desktop ${release_version} (upstream ${upstream_version} @ $(git rev-parse --short HEAD))"

                  # Each build gets its own tag, so diff the changesets against
                  # our previous release to list what is new since it.
                  if [ -n "${previous_tag}" ]; then
                      git fetch --force --depth=1 --no-tags origin "refs/tags/${previous_tag}:refs/tags/${previous_tag}" || previous_tag=""
                  fi

                  echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
                  echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"
                  echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
                  echo "release_title=${release_title}" >> "${GITHUB_OUTPUT}"
                  node .github/scripts/release-notes.mjs desktop/changes "${previous_tag}" >> "${GITHUB_OUTPUT}"

    build:
        needs: build-metadata
        runs-on: ${{ matrix.os }}

        permissions:
            contents: write

        strategy:
            matrix:
                # Add macos-latest / ubuntu-latest back to build those too; the
                # steps guarded on the runner OS below are kept for that reason.
                os: [windows-latest]

        env:
            RELEASE_TAG: ${{ needs.build-metadata.outputs.release_tag }}

        defaults:
            run:
                working-directory: desktop

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: ${{ needs.build-metadata.outputs.commit_sha }}

            - name: Setup node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: "npm"
                  cache-dependency-path: "desktop/package-lock.json"

            - name: Install dependencies
              run: npm ci

            # electron-builder takes the version it stamps into the installers
            # and into latest.yml from desktop/package.json, so replace upstream's
            # with the one build-metadata computed. Computed once there rather
            # than here so that every runner in the matrix agrees on it.
            - name: Set the release version
              working-directory: ${{ github.workspace }}
              run: node .github/scripts/photos-desktop-version.mjs set "${{ needs.build-metadata.outputs.release_version }}"

            - name: Setup Rust cache
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  workspaces: rust
                  shared-key: rust-desktop

            - name: Fetch binary dependencies and rebuild native modules
              run: npm run postinstall

            - name: Create universal ffmpeg binaries for macOS
              if: startsWith(matrix.os, 'macos')
              # ffmpeg-static ships each macOS architecture separately; combine them with lipo.
              run: |
                  rm -f node_modules/ffmpeg-static/ffmpeg
                  npm_config_arch=arm64 node node_modules/ffmpeg-static/install.js
                  mv node_modules/ffmpeg-static/ffmpeg ffmpeg-arm64
                  npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
                  mv node_modules/ffmpeg-static/ffmpeg ffmpeg-x64
                  lipo -create ffmpeg-arm64 ffmpeg-x64 -output node_modules/ffmpeg-static/ffmpeg
                  rm ffmpeg-arm64 ffmpeg-x64
                  file node_modules/ffmpeg-static/ffmpeg

            - name: Install libarchive-tools for pacman build
              if: startsWith(matrix.os, 'ubuntu')
              run: sudo apt-get update && sudo apt-get install libarchive-tools

            - name: Build
              run: npm run build:ci

            - name: Package
              shell: bash
              run: |
                  if [ "${RUNNER_OS}" = "macOS" ]; then
                      # There is no Apple certificate, so tell electron-builder
                      # to skip signing rather than fail looking for an identity.
                      export CSC_IDENTITY_AUTO_DISCOVERY=false
                  elif [ "${RUNNER_OS}" = "Linux" ]; then
                      export TARGET_CC=clang
                      export TARGET_CXX=clang++
                  fi

                  platform=${{ startsWith(matrix.os, 'macos') && 'mac' || startsWith(matrix.os, 'windows') && 'windows' || 'linux' }}

                  npm exec -- electron-builder --$platform --publish never
              env:
                  # Workaround recommended in
                  # https://github.com/electron-userland/electron-builder/issues/3179
                  USE_HARD_LINKS: false

            # A workflow artifact is a single zip, expires after 30 days, and
            # needs a GitHub login to fetch. A release gives each installer its
            # own permanent download URL, and carries the electron-updater
            # metadata (latest.yml, .blockmap) alongside them.
            - name: Publish release
              uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
              with:
                  tag: ${{ env.RELEASE_TAG }}
                  commit: ${{ needs.build-metadata.outputs.commit_sha }}
                  name: ${{ needs.build-metadata.outputs.release_title }}
                  body: ${{ needs.build-metadata.outputs.release_body }}
                  artifacts: "desktop/dist/ente-*.@(exe|dmg|AppImage|deb|rpm|pacman),desktop/dist/*.blockmap,desktop/dist/latest*.yml"
                  artifactErrorsFailBuild: true
                  # The first runner in the matrix creates the release; the rest
                  # add to it rather than failing on an existing tag. Assets of
                  # the same name are replaced; those from another runner OS are
                  # left alone.
                  allowUpdates: true
                  # electron-updater resolves updates through GitHub's "latest
                  # release" pointer, which a prerelease can never hold.
                  prerelease: false
                  makeLatest: true
            # There is no step afterwards to move the tag onto the built commit:
            # each build has its own tag, which the release above creates at the
            # commit it built. Only the rolling tag of the old scheme could end
            # up left behind on an earlier commit.
