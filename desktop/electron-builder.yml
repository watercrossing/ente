appId: io.ente.bhari-frame
artifactName: ${productName}-${version}-${arch}.${ext}
# Without this, the update feed is inferred from package.json's `repository`
# (ente/photos-desktop), and these custom builds would offer the official
# release as an "update" over themselves.
publish:
    provider: github
    owner: watercrossing
    repo: ente
files:
    - app/**/*
    - out
extraFiles:
    - from: build
      to: resources
beforeBuild: scripts/beforeBuild.js
protocols:
    - name: Ente
      schemes: ["ente"]
win:
    target:
        - target: nsis
          arch: [x64, arm64]
nsis:
    deleteAppDataOnUninstall: true
linux:
    target:
        - target: AppImage
          arch: [x64, arm64]
        - target: deb
          arch: [x64, arm64]
        - target: rpm
          arch: [x64, arm64]
        - target: pacman
          arch: [x64, arm64]
    category: Photography
    icon: ./build/icon.icns
mac:
    minimumSystemVersion: "13.3"
    target:
        target: default
        arch: [universal]
    category: public.app-category.photography
    hardenedRuntime: true
    mergeASARs: false
    # Both macOS build passes contain separate x64 and arm64 binaries. Copy them
    # into the universal app unchanged; the app selects one at runtime.
    x64ArchFiles: "**/{napi,onnxruntime}/**"
